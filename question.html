<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажер ЭМО - Вопрос</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="image-gallery">
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1509391618207-32f1fa13c1d2?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxvcmFuZ2UlMjBmcnVpdHxlbnwxfHx8fDE3NTk3NzU0OTh8MA&ixlib=rb-4.1.0&q=80&w=400" alt="Апельсин">
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1648871226770-3e786bd70244?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxkb2clMjBwZXR8ZW58MXx8fHwxNzU5ODQ1MzA4fDA&ixlib=rb-4.1.0&q=80&w=400" alt="Собака">
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxib29rJTIwcmVhZGluZ3xlbnwxfHx8fDE3NTk4MjYwNTV8MA&ixlib=rb-4.1.0&q=80&w=400" alt="Книга">
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1670974636823-1341d802d5b4?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxtb3VudGFpbnMlMjBsYW5kc2NhcGV8ZW58MXx8fHwxNzU5NzQ2MjMzfDA&ixlib=rb-4.1.0&q=80&w=400" alt="Горы">
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxjYXQlMjBwZXR8ZW58MXx8fHwxNzU5ODQ5MjY2fDA&ixlib=rb-4.1.0&q=80&w=400" alt="Кот">
      </div>
    </div>

    <div class="question-panel">
      <div class="panel-outer">
        <div class="panel-inner">
          <div class="question-content">
            <div class="question-numbers">
              <div class="number-circle" id="question-1">1</div>
              <div class="number-circle" id="question-2">2</div>
              <div class="number-circle" id="question-3">3</div>
              <div class="number-circle" id="question-4">4</div>
              <div class="number-circle" id="question-5">5</div>
            </div>

            <div class="question-main">
              <div class="question-image">
                <img id="current-image" src="" alt="Что изображено на картинке?">
              </div>

              <div class="answer-section">
                <div class="input-wrapper">
                  <input type="text" class="answer-input" placeholder="Введите ответ..." id="answer-input">
                </div>
                <button class="submit-button" id="submit-button" disabled>✓</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="navigation-link">
      <a href="results.html" class="link-button">Посмотреть результаты →</a>
    </div>
  </div>

  <script>
    const answerInput = document.getElementById('answer-input');
    const submitButton = document.getElementById('submit-button');
    const currentImage = document.getElementById('current-image');
    const questionCircles = [
      document.getElementById('question-1'),
      document.getElementById('question-2'),
      document.getElementById('question-3'),
      document.getElementById('question-4'),
      document.getElementById('question-5')
    ];

    // Данные вопросов
    const questions = [
      {
        image: 'https://images.unsplash.com/photo-1509391618207-32f1fa13c1d2?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxvcmFuZ2UlMjBmcnVpdHxlbnwxfHx8fDE3NTk3NzU0OTh8MA&ixlib=rb-4.1.0&q=80&w=1080',
        correctAnswer: 'АПЕЛЬСИН'
      },
      {
        image: 'https://images.unsplash.com/photo-1648871226770-3e786bd70244?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxkb2clMjBwZXR8ZW58MXx8fHwxNzU5ODQ1MzA4fDA&ixlib=rb-4.1.0&q=80&w=1080',
        correctAnswer: 'СОБАКА'
      },
      {
        image: 'https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxib29rJTIwcmVhZGluZ3xlbnwxfHx8fDE3NTk4MjYwNTV8MA&ixlib=rb-4.1.0&q=80&w=1080',
        correctAnswer: 'КНИГА'
      },
      {
        image: 'https://images.unsplash.com/photo-1670974636823-1341d802d5b4?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxtb3VudGFpbnMlMjBsYW5kc2NhcGV8ZW58MXx8fHwxNzU5NzQ2MjMzfDA&ixlib=rb-4.1.0&q=80&w=1080',
        correctAnswer: 'ГОРЫ'
      },
      {
        image: 'https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxjYXQlMjBwZXR8ZW58MXx8fHwxNzU5ODQ5MjY2fDA&ixlib=rb-4.1.0&q=80&w=1080',
        correctAnswer: 'КОТ'
      }
    ];

    let currentQuestionIndex = 0;
    let userAnswers = JSON.parse(localStorage.getItem('userAnswers')) || Array(questions.length).fill('');

    // Инициализация
    function initializeQuiz() {
      updateQuestionDisplay();
      updateQuestionNumbers();
    }

    // Обновление отображения текущего вопроса
    function updateQuestionDisplay() {
      currentImage.src = questions[currentQuestionIndex].image;
      answerInput.value = userAnswers[currentQuestionIndex] || '';
      toggleButtonState();
    }

    // Обновление номеров вопросов
    function updateQuestionNumbers() {
      questionCircles.forEach((circle, index) => {
        circle.classList.remove('is-active', 'is-completed');
        
        if (index === currentQuestionIndex) {
          circle.classList.add('is-active');
        } else if (userAnswers[index]) {
          circle.classList.add('is-completed');
        }
      });
    }

    function toggleButtonState() {
      const hasValue = answerInput.value.trim().length > 0;
      submitButton.disabled = !hasValue;
      submitButton.classList.toggle('is-enabled', hasValue);
    }

    function handleSubmit() {
      const userAnswer = answerInput.value.trim().toUpperCase();
      if (userAnswer) {
        // Сохраняем ответ
        userAnswers[currentQuestionIndex] = userAnswer;
        localStorage.setItem('userAnswers', JSON.stringify(userAnswers));
        
        // Переходим к следующему вопросу или результатам
        if (currentQuestionIndex < questions.length - 1) {
          currentQuestionIndex++;
          updateQuestionDisplay();
          updateQuestionNumbers();
        } else {
          // Все вопросы отвечены, переходим к результатам
          window.location.href = 'results.html';
        }
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        handleSubmit();
      }
    }

    // Обработчики для клика по номерам вопросов
    questionCircles.forEach((circle, index) => {
      circle.addEventListener('click', () => {
        currentQuestionIndex = index;
        updateQuestionDisplay();
        updateQuestionNumbers();
      });
    });

    answerInput.addEventListener('input', toggleButtonState);
    submitButton.addEventListener('click', handleSubmit);
    answerInput.addEventListener('keypress', handleKeyPress);

    // Инициализация при загрузке
    initializeQuiz();
  </script>
</body>
</html>
