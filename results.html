<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты - Тренажер ЭМО</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="card results-card">
            <div class="results-header">
                <h1 class="title">Ваши ответы</h1>
                <button class="close-button" id="restartButton">×</button>
            </div>
            
            <div class="results-table">
                <div class="table-header">
                    <div class="table-cell">Вопрос</div>
                    <div class="table-cell">Ваш ответ</div>
                </div>
                <!-- Результаты появятся здесь автоматически -->
            </div>
            
            <button class="button restart-button" id="restartMainButton">
                Начать заново
            </button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
