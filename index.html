<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер ЭМО</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="card question-card">
            <div class="progress-bar">
                <div class="progress" style="width: 20%"></div>
            </div>
            
            <h1 class="title">Вопрос 1 из 5</h1>
            
            <div class="question-text">
                Как вы себя чувствуете сегодня?
            </div>
            
            <div class="options-container">
                <button class="option-button">Отлично</button>
                <button class="option-button">Хорошо</button>
                <button class="option-button">Нормально</button>
                <button class="option-button">Плохо</button>
            </div>
            
            <div class="navigation">
                <button class="button nav-button" id="nextButton">Далее</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
